<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94" />
      <stop offset="50%" stop-color="#D9AE52" />
      <stop offset="100%" stop-color="#B28228" />
    </linearGradient>
    <linearGradient id="amberDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon Top -->
  <g transform="translate(225, 20) scale(0.7)">
    <path d="M-15,10 C-15,0 0,-15 0,-15 C0,-15 15,0 15,10 C15,18 8,24 0,24 C-8,24 -15,18 -15,10 Z" fill="url(#amberDrop)" stroke="#F7DF94" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="3.5" fill="#FFE082" />
  </g>

  <!-- MEHRAB Stylized Lettering -->
  <text x="225" y="78" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        stroke="#1a1200" 
        stroke-width="1.2"
        filter="url(#softGlow)">
    MEHRAB
  </text>

  <!-- Horizontal divider lines and PERFUME subtitle -->
  <line x1="60" y1="102" x2="160" y2="102" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="165" cy="102" r="2" fill="#F7DF94" />
  
  <text x="225" y="107" 
        font-family="'DM Sans', 'Montserrat', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="#FFFFFF">
    PERFUME
  </text>

  <circle cx="285" cy="102" r="2" fill="#F7DF94" />
  <line x1="290" y1="102" x2="390" y2="102" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
